[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stil-to-ni-digital"
version = "0.1.0"
description = "Convert a practical TetraMAX STIL scan-pattern subset to NI-Digital pattern source and timing files."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "stil-to-ni-digital contributors" }]
keywords = ["STIL", "NI-Digital", "ATE", "scan", "digipatsrc", "digitiming"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
]
dependencies = []

[project.urls]
Documentation = "https://github.com/dong7727/stil-to-ni-digital#readme"
Issues = "https://github.com/dong7727/stil-to-ni-digital/issues"

[project.scripts]
stil-to-ni = "stil_to_ni.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
